<div class="container mt-3">
  <h2>Ajouter une Chanson :</h2>

  <form #f="ngForm" (ngSubmit)="addChanson()">

    <div class="col-sm-2">
      <label>ID Chanson</label>
      <input type="number" [(ngModel)]="newChanson.idChanson"
        name="idChanson" class="form-control" required>
    </div>

    <div class="col-sm-4">
      <label>Titre</label>
      <input type="text" [(ngModel)]="newChanson.titre"
        name="titre" class="form-control" required>
    </div>

    <div class="col-sm-4">
      <label>Artiste</label>
      <input type="text" [(ngModel)]="newChanson.artiste"
        name="artiste" class="form-control">
    </div>

    <div class="col-sm-2">
      <label>Durée</label>
      <input type="number" [(ngModel)]="newChanson.duree"
        name="duree" class="form-control">
    </div>

    <div class="col-sm-4">
      <label>Date de création</label>
      <input type="date" [(ngModel)]="newChanson.dateCreation"
        name="dateCreation" class="form-control">
    </div>

    <div class="col-sm-4">
      <label>Genre</label>
      <select class="form-control form-control-lg" id="idGenre" name="idGenre"
        [(ngModel)]="newIdGenre">
        @for (g of genres; track g.idGenre) {
          <option [ngValue]="g.idGenre">{{g.nomGenre}}</option>
        }
      </select>
    </div>

    <div class="mt-2">
      <button type="submit" class="btn btn-success" [disabled]="f.invalid">Ajouter</button>
    </div>

  </form>
</div>
