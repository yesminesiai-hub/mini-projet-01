<div class="container mt-3">
  <h2>Modifier une Chanson :</h2>

  <form>

    <div hidden class="col-sm-2">
      <label>ID Chanson</label>
      <input type="text" [(ngModel)]="currentChanson.idChanson"
        name="idChanson" class="form-control">
    </div>

    <div class="col-sm-4">
      <label>Titre</label>
      <input type="text" [(ngModel)]="currentChanson.titre"
        name="titre" class="form-control">
    </div>

    <div class="col-sm-4">
      <label>Artiste</label>
      <input type="text" [(ngModel)]="currentChanson.artiste"
        name="artiste" class="form-control">
    </div>

    <div class="col-sm-2">
      <label>Durée</label>
      <input type="number" [(ngModel)]="currentChanson.duree"
        name="duree" class="form-control">
    </div>

    <div class="col-sm-4">
      <label>Date de création</label>
      <input type="date" [ngModel]="currentChanson.dateCreation | date: 'yyyy-MM-dd'"
        (ngModelChange)="currentChanson.dateCreation = $event"
        name="dateCreation" class="form-control">
    </div>

    <div class="col-sm-4">
      <label>Genre</label>
      <select class="form-control form-control-lg" id="idGenre" name="idGenre"
        [(ngModel)]="updatedGenreId">
        @for (g of genres; track g.idGenre) {
          <option [ngValue]="g.idGenre">{{g.nomGenre}}</option>
        }
      </select>
    </div>

    <div class="mt-2">
      <button type="submit" (click)="updateChanson()" class="btn btn-success">Modifier</button>
    </div>

  </form>
</div>
